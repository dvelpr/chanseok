<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Chanseok personal website" />
  <title>Chanseok</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="nav">
    <a class="logo" href="#home">CHANSEOK</a>
    <nav class="nav-links">
      <a href="#about">About</a>
      <a href="#gallery">Photos</a>
      <a href="#contact">Contact</a>
    </nav>
  </header>

  <main>
    <section id="home" class="hero">
      <div class="hero-copy">
        <p class="eyebrow">PERSONAL WEBSITE</p>
        <h1>Hi, I'm Chanseok.</h1>
        <p class="lead">Welcome to my personal website.</p>
        <a class="button" href="#about">Learn more</a>
      </div>

      <div class="hero-photo-wrap">
        <img class="hero-photo" src="images/profile1.jpg" alt="Chanseok profile photo" />
      </div>
    </section>

    <section id="about" class="section">
      <p class="eyebrow">ABOUT</p>
      <h2>About Me</h2>
      <p class="section-copy">
        Add your introduction, career, interests, or other information here.
      </p>
    </section>

    <section id="gallery" class="section">
      <p class="eyebrow">PHOTOS</p>
      <h2>Gallery</h2>

      <div class="gallery">
        <img src="images/profile1.jpg" alt="Portrait 1" />
        <img src="images/profile2.jpg" alt="Portrait 2" />
        <img src="images/profile3.jpg" alt="Portrait 3" />
      </div>
    </section>

    <section id="contact" class="section">
      <p class="eyebrow">CONTACT</p>
      <h2>Contact</h2>
      <p class="section-copy">Replace this with your email or social links.</p>
    </section>
  </main>

  <footer>
    <p>© 2026 Chanseok</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
